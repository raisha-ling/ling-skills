name: safety-check

# The scanner was documented in CONTRIBUTING and enforced by nothing: no CI, no
# hooks, no branch protection. Anyone could open a PR with a live key and the only
# thing standing in the way was a reviewer remembering to run a script by hand.
# This makes it mechanical. A rule without a mechanism decays.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Job id is the status-check context name used by branch protection.
  # Renaming it silently detaches the required check. Don't.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate marketplace.json
        # The marketplace file is hand-edited on every contribution, and a bad
        # hand-merge shipped invalid JSON to main under a green scan (25 Aug 2026):
        # every `claude plugin marketplace update` failed until it was repaired.
        # The scanner checks skills; this checks the file that installs them.
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path
          p = Path(".claude-plugin/marketplace.json")
          try:
              d = json.loads(p.read_text())
          except json.JSONDecodeError as e:
              print(f"::error file={p}::invalid JSON, plugin installs will fail for everyone: {e}")
              sys.exit(1)
          bad = 0
          for pl in d.get("plugins", []):
              name = pl.get("name", "<unnamed>")
              for field in ("name", "source", "version"):
                  if not pl.get(field):
                      print(f"::error file={p}::plugin '{name}' is missing '{field}'")
                      bad += 1
              src = pl.get("source", "")
              if src and not Path(src).is_dir():
                  print(f"::error file={p}::plugin '{name}' points at a folder that does not exist: {src}")
                  bad += 1
          sys.exit(1 if bad else 0)
          EOF

      - name: Regression suite
        # Runs first. If the scanner itself is broken, its verdict on a submission
        # is worthless, and a scanner that silently stops catching things is the
        # exact failure this repo already had once.
        run: python3 tests/run.py

      - name: Scan every skill in the marketplace
        run: |
          # NOT `set -e`. Actions runs run: steps as `bash -e {0}`, so a bare
          # failing command aborts the step before `rc=$?` is ever reached: the
          # loop would stop at the first bad skill and the ::error annotation,
          # the thing a non-engineer actually reads, would never print. `|| rc=$?`
          # is what keeps the loop alive.
          set -uo pipefail
          status=0
          found=0
          while IFS= read -r skill; do
            found=$((found + 1))
            echo "::group::$skill"
            rc=0
            python3 scripts/safety-check.py "$skill" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 2 ]; then
              echo "::error file=$skill::LEAK - secret, credential or internal id. Rotate it if it was real."
              status=2
            elif [ "$rc" -eq 1 ] && [ "$status" -ne 2 ]; then
              echo "::error file=$skill::GAP - missing SKILL.md or definition of done."
              status=1
            fi
          done < <(find plugins -type d -name skills -exec find {} -mindepth 1 -maxdepth 1 -type d \;)

          # The manifests are edited in the same PR as the skill, so scanning only
          # skills/ leaves the file most likely to hold an id unscanned.
          echo "::group::manifests"
          mrc=0
          python3 scripts/safety-check.py .claude-plugin || mrc=$?
          echo "::endgroup::"
          [ "$mrc" -eq 2 ] && status=2

          if [ "$found" -eq 0 ]; then
            echo "::error::no skills found to scan - the discovery glob is wrong, failing rather than passing empty"
            exit 1
          fi
          echo "scanned $found skill(s)"
          exit $status
